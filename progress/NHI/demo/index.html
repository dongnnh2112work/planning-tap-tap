<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Choo Zoo · Thảo Cầm Viên</title>
  <style>
    @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-SemiBold.ttf") format("truetype"); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Be Vietnam Pro"; src: url("fonts/BeVietnamPro-ExtraBold.ttf") format("truetype"); font-weight: 800; font-style: normal; font-display: swap; }
    :root {
      --color-bg: #F1F0EC;
      --color-card: #FFFFFF;
      --color-text: #1C1B19;
      --color-text-muted: #4A4640;
      --color-accent: #E0B034;
      --color-accent-text: #1C1B19;
      --color-peach: #F0D5CC;
      --color-lilac: #E0D4EE;
      --color-sage: #D3DEC4;
      --color-butter: #E8C75A;
      --color-taupe: #D2C8BA;
      --color-brown: #7A5340;
      --color-olive: #6B7F45;
      --color-stone: #9A9186;
      --color-success: #4F7A52;
      --color-warning: #C4922A;
      --color-error: #B25A4A;
      --color-line: #E4E0DA;
      --color-track: #F3F1ED;
      --color-map-land: #C5D4B6;
      --color-map-water: #B7C9CE;
      --color-map-path: #E6D4B4;
      --color-you: #E8C4B4;
      --color-route: #5A7EA8;
      --color-route-dim: #C8C3BA;
      --color-dot: #3F72B0;
      --font-sans: "Be Vietnam Pro", sans-serif;
      --fs-display: 80px;
      --fw-display: 800;
      --lh-display: 1.00;
      --fs-greeting: 26px;
      --fw-greeting: 800;
      --lh-greeting: 1.15;
      --fs-heading: 20px;
      --fw-heading: 800;
      --lh-heading: 1.20;
      --fs-title: 16px;
      --fw-title: 700;
      --lh-title: 1.25;
      --fs-body: 14px;
      --fw-body: 400;
      --lh-body: 1.45;
      --fs-label: 12px;
      --fw-label: 600;
      --lh-label: 1.30;
      --fs-caption: 12px;
      --fw-caption: 400;
      --lh-caption: 1.35;
      --fs-button: 16px;
      --fw-button: 600;
      --lh-button: 1.20;
      --radius-xs: 8px;
      --radius-sm: 16px;
      --radius-md: 24px;
      --radius-lg: 28px;
      --radius-xl: 40px;
      --radius-pill: 999px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --shadow-card: 0 8px 24px rgba(28, 27, 25, 0.06);
      --shadow-soft: 0 2px 8px rgba(28, 27, 25, 0.04);
      --screen-inset: 20px;
      --cta-height: 54px;
      --icon-button: 36px;
      --avatar: 48px;
      --dur: 240ms;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    html, body, button, input, select, textarea {
      font-family: var(--font-sans);
    }
    svg, svg text { font-family: var(--font-sans); }
    body {
      font-family: var(--font-sans);
      color: var(--color-text);
      background: #D8D5CF;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }
    .device {
      width: 390px;
      height: 844px;
      background: var(--color-bg);
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-xl);
      box-shadow: 0 30px 70px rgba(28, 27, 25, .22);
    }
    @media (max-width: 430px) {
      body { background: var(--color-bg); }
      .device { width: 100vw; height: 100dvh; height: 100vh; border-radius: 0; box-shadow: none; }
    }
    .statusbar {
      height: 48px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 22px 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .statusbar .sigs { display: flex; gap: 6px; align-items: center; font-size: 12px; }
    .bar { width: 17px; height: 10px; border: 1.5px solid var(--color-text); border-radius: 3px; position: relative; }
    .bar::after { content: ""; position: absolute; inset: 2px 6px 2px 2px; background: var(--color-text); border-radius: 1px; }
    #app {
      height: calc(100% - 48px);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    #app.is-leaving { opacity: 0; transform: translate3d(0, 14px, 0); }
    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 16px 8px; min-height: 48px; flex: 0 0 auto;
    }
    .topbar h2 { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
    .icon-btn {
      width: var(--icon-button); height: var(--icon-button); border-radius: var(--radius-pill);
      border: none; background: var(--color-card); color: var(--color-text);
      display: grid; place-items: center; cursor: pointer;
      box-shadow: var(--shadow-soft); font-weight: 700; font-size: 15px;
      transition: transform 140ms var(--ease);
    }
    .icon-btn.ghost { background: transparent; box-shadow: none; }
    .pad { padding: 4px var(--screen-inset) 28px; overflow: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: var(--fs-greeting); font-weight: var(--fw-greeting); letter-spacing: -.03em; line-height: var(--lh-greeting); }
    .muted { color: var(--color-text-muted); }
    .tiny { font-size: var(--fs-caption); color: var(--color-text-muted); line-height: var(--lh-caption); }
    .lead { font-size: 15px; line-height: 1.45; color: var(--color-text-muted); }
    label { display: block; font-size: var(--fs-label); font-weight: var(--fw-label); margin: 0 0 6px; }
    input[type=email], input[type=text], select {
      width: 100%; height: 52px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--color-line); background: var(--color-card);
      padding: 0 16px; font: 500 16px/1.2 var(--font-sans); color: var(--color-text); outline: none;
    }
    select {
      padding-right: 32px;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 L6 6.5 L11 1.5' fill='none' stroke='%231C1B19' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
    }
    input:focus, select:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(224, 176, 52, .28); }
    .dob-row { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }
    .field { margin-bottom: 14px; }
    .btn, .goal, .station, .choice, .icon-btn, .chip-btn, .hcard {
      transition: transform 140ms var(--ease), filter 140ms var(--ease), background 160ms var(--ease);
    }
    .btn:active, .goal:active, .station:active, .choice:active, .icon-btn:active, .chip-btn:active, .hcard:active {
      transform: scale(0.97);
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: var(--cta-height); border-radius: var(--radius-pill);
      border: none; font: var(--fw-button) var(--fs-button)/var(--lh-button) var(--font-sans);
      cursor: pointer; color: var(--color-accent-text); background: var(--color-accent);
      box-shadow: var(--shadow-soft);
    }
    .btn[disabled] { opacity: .4; pointer-events: none; }
    [hidden] { display: none !important; }
    .btn.ghost { background: var(--color-card); color: var(--color-text); box-shadow: none; border: 1.5px solid var(--color-line); }
    .btn.sm { min-height: 44px; font-size: 14px; }
    .card {
      background: var(--color-card); border-radius: var(--radius-lg);
      padding: 16px 20px; box-shadow: var(--shadow-card);
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: var(--radius-pill); padding: 4px 10px;
      font-size: var(--fs-label); font-weight: var(--fw-label);
      background: var(--color-track); color: var(--color-text);
    }
    .chip.peach { background: var(--color-peach); }
    .chip.lilac { background: var(--color-lilac); }
    .chip.sage { background: var(--color-sage); }
    .chip.butter { background: var(--color-butter); }
    .chip.taupe { background: var(--color-taupe); }
    .chip-row { display: flex; gap: 8px; overflow: auto; padding: 2px 0 4px; scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip-btn {
      flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%;
      border: none; background: var(--color-track); color: var(--color-text);
      font: 700 12px var(--font-sans); cursor: pointer;
    }
    .chip-btn.on { background: var(--color-accent); }
    .goal-row { display: flex; gap: 10px; overflow: auto; padding: 4px 0 14px; scrollbar-width: none; }
    .goal-row::-webkit-scrollbar { display: none; }
    .goal {
      flex: 0 0 148px; text-align: left; cursor: pointer;
      background: var(--color-peach); border: 2px solid transparent;
      border-radius: var(--radius-md); padding: 14px; color: inherit; min-height: 132px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .goal:nth-child(5n+2) { background: var(--color-butter); }
    .goal:nth-child(5n+3) { background: var(--color-lilac); }
    .goal:nth-child(5n+4) { background: var(--color-sage); }
    .goal:nth-child(5n+5) { background: var(--color-taupe); }
    .goal-row .goal.on { background: var(--color-accent); border-color: var(--color-text); }
    .goal b { font-size: 15px; font-weight: 800; letter-spacing: -.02em; display: block; }
    .goal span { font-size: 12px; color: var(--color-text-muted); display: block; margin-top: 6px; }
    .goal em { font-style: normal; font-size: 11px; font-weight: 700; margin-top: 10px; display: inline-flex; background: rgba(255,255,255,.7); border-radius: var(--radius-pill); padding: 3px 8px; width: max-content; }
    .station {
      display: grid; grid-template-columns: 44px 1fr 28px; gap: 12px; align-items: center;
      background: var(--color-card); border: none; border-radius: var(--radius-md);
      padding: 10px 12px; margin-bottom: 8px; cursor: pointer; text-align: left; width: 100%; color: inherit;
      box-shadow: var(--shadow-soft);
    }
    .station .ico {
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center; background: var(--color-sage);
    }
    .station.break .ico { background: var(--color-lilac); }
    .station h3 { font-size: var(--fs-title); font-weight: var(--fw-title); letter-spacing: -.01em; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .pill {
      font-size: 11px; font-weight: 600; border-radius: var(--radius-pill);
      padding: 2px 8px; background: var(--color-track);
    }
    .check {
      width: 24px; height: 24px; border-radius: 50%; background: var(--color-track);
      display: grid; place-items: center; font-size: 13px;
    }
    .station.on .check { background: var(--color-accent); color: var(--color-accent-text); }
    .sticky {
      position: sticky; bottom: 0; padding: 10px var(--screen-inset) 16px;
      background: linear-gradient(transparent, var(--color-bg) 28%);
      flex: 0 0 auto;
    }
    .hero-pair { display: grid; grid-template-columns: 1fr 64px; gap: 10px; margin: 14px 0 16px; min-height: 168px; }
    .hero-main {
      background: var(--color-butter); border-radius: var(--radius-lg); padding: 18px 16px;
      position: relative; overflow: hidden; box-shadow: var(--shadow-card);
    }
    .hero-main h3 { font-size: 18px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 6px; }
    .hero-side {
      background: var(--color-taupe); border-radius: var(--radius-lg);
      writing-mode: vertical-rl; transform: rotate(180deg);
      display: grid; place-items: center; font-weight: 800; font-size: 13px;
      letter-spacing: .08em; cursor: pointer; border: none; color: inherit;
    }
    .hscroll { display: flex; gap: 10px; overflow: auto; padding: 2px 0 8px; scrollbar-width: none; }
    .hscroll::-webkit-scrollbar { display: none; }
    .hcard {
      flex: 0 0 168px; border: none; border-radius: var(--radius-md); padding: 14px;
      text-align: left; cursor: pointer; color: inherit; min-height: 118px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .hcard b { font-size: 15px; font-weight: 800; }
    .hcard span { font-size: 12px; color: var(--color-text-muted); margin-top: 8px; }
    .bnav {
      display: grid; grid-template-columns: 1fr 1fr 64px 1fr 1fr;
      align-items: end; padding: 6px 10px 12px; background: var(--color-card);
      box-shadow: 0 -4px 20px rgba(28,27,25,.04);
    }
    .bnav button {
      border: none; background: none; color: var(--color-text-muted);
      font: 600 10px var(--font-sans); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .bnav button.on { color: var(--color-text); }
    .bnav .plus {
      width: 52px; height: 52px; border-radius: 50%; background: var(--color-accent); color: var(--color-accent-text);
      font-size: 28px; font-weight: 600; margin-top: -18px; box-shadow: var(--shadow-card);
      display: grid; place-items: center;
    }
    .mapbox { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .map-card { margin: 0 20px; border-radius: var(--radius-lg); overflow: hidden; background: var(--color-map-water); height: 280px; box-shadow: var(--shadow-card); }
    .map-card svg, .map-fit svg { width: 100%; height: 100%; display: block; }
    .map-fit { flex: 1; min-height: 0; }
    .nav-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
    .map-viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--color-map-water); }
    .map-viewport svg { width: 100%; height: 100%; display: block; touch-action: none; }
    .nav-banner {
      position: absolute; top: 56px; left: 16px; right: 16px; z-index: 4;
      background: var(--color-card); border-radius: var(--radius-md);
      padding: 12px 14px; box-shadow: var(--shadow-card);
      display: flex; gap: 10px; align-items: center;
    }
    .nav-banner .turn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--color-route); color: #fff;
      display: grid; place-items: center; flex: 0 0 36px; font-size: 16px;
    }
    .nav-banner p { font-size: 14px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
    .nav-top-abs { position: absolute; top: 8px; left: 12px; right: 12px; z-index: 5; padding: 0; background: transparent; }
    .nav-sheet {
      background: var(--color-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 16px 20px 18px; box-shadow: 0 -8px 28px rgba(28,27,25,.06); flex: 0 0 auto;
    }
    .nav-sheet h2 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin: 4px 0 6px; }
    .recenter {
      position: absolute; right: 16px; bottom: 16px; z-index: 3;
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--color-card); box-shadow: var(--shadow-card); cursor: pointer; color: var(--color-text);
    }
    .overlay {
      position: absolute; inset: 0; background: rgba(28, 27, 25, .28);
      z-index: 8; display: flex; align-items: flex-end; justify-content: center; padding: 16px;
    }
    .overlay.center { align-items: center; }
    .modal {
      width: 100%; background: var(--color-card); border-radius: var(--radius-lg);
      padding: 22px 20px; box-shadow: var(--shadow-card);
    }
    .howto { padding-left: 18px; margin: 8px 0 14px; font-size: 14px; }
    .howto li { margin: 0 0 6px; line-height: 1.4; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .choices.stack { grid-template-columns: 1fr; }
    .choice {
      min-height: 72px; border-radius: var(--radius-md); border: 2px solid transparent;
      background: var(--color-card); font: 700 16px var(--font-sans); color: var(--color-text);
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      box-shadow: var(--shadow-soft);
    }
    .choices.stack .choice { min-height: 56px; flex-direction: row; justify-content: flex-start; padding: 0 16px; }
    .choice:nth-child(1) { background: var(--color-lilac); }
    .choice:nth-child(2) { background: var(--color-sage); }
    .choice:nth-child(3) { background: var(--color-peach); }
    .choice:nth-child(4) { background: var(--color-taupe); }
    .choice.ok { border-color: var(--color-success); box-shadow: 0 0 0 2px rgba(79,122,82,.25); }
    .choice.bad { border-color: var(--color-error); }
    .timer { height: 8px; border-radius: var(--radius-pill); background: var(--color-track); overflow: hidden; margin: 12px 0 4px; }
    .timer > i { display: block; height: 100%; width: 100%; background: var(--color-accent); border-radius: inherit; transform-origin: left center; }
    .viewfinder {
      position: relative; aspect-ratio: 3/4; max-height: 340px; margin: 12px auto;
      width: 100%; border-radius: var(--radius-lg); overflow: hidden; background: var(--color-taupe);
    }
    .viewfinder img { width: 100%; height: 100%; object-fit: cover; }
    .ph { width: 100%; height: 100%; display: grid; place-items: center; color: var(--color-text-muted); text-align: center; padding: 20px; }
    .frame-orn { pointer-events: none; position: absolute; inset: 12px; border: 2px dashed rgba(28,27,25,.28); border-radius: 20px; }
    .viewfinder.zen .frame-orn { box-shadow: inset 0 0 0 8px rgba(224, 212, 238, .45); }
    .viewfinder.vintage { background: #cfc3a4; }
    .viewfinder.vintage::before, .viewfinder.vintage::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 16px;
      background: repeating-linear-gradient(#1C1B19 0 8px, transparent 8px 16px);
      opacity: .7; z-index: 2;
    }
    .viewfinder.vintage::before { left: 0; }
    .viewfinder.vintage::after { right: 0; }
    .frame-cap {
      position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 3;
      background: var(--color-card); border-radius: var(--radius-pill);
      padding: 6px 10px; font-size: 12px; font-weight: 700; text-align: center;
    }
    .seg { display: flex; gap: 6px; margin: 10px 0; }
    .seg button {
      flex: 1; height: 40px; border-radius: var(--radius-pill); border: none;
      background: var(--color-card); font: 600 13px var(--font-sans); color: var(--color-text);
      cursor: pointer; box-shadow: var(--shadow-soft);
    }
    .seg button.on { background: var(--color-accent); }
    .hidden-file { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
    .idol-stage { perspective: 900px; margin: 16px 0; }
    .idol-card { position: relative; height: 280px; }
    .idol-inner { position: relative; width: 100%; height: 100%; transition: transform 560ms var(--ease); transform-style: preserve-3d; }
    .idol-card.open .idol-inner { transform: rotateY(180deg); }
    .idol-face {
      position: absolute; inset: 0; border-radius: var(--radius-lg); padding: 20px;
      backface-visibility: hidden; box-shadow: var(--shadow-card);
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    .idol-front { background: var(--color-butter); }
    .idol-back { background: var(--color-card); transform: rotateY(180deg); align-items: flex-start; text-align: left; }
    .finale { flex: 1; display: flex; flex-direction: column; position: relative; overflow: auto; }
    .finale-card {
      margin: auto 20px; background: var(--color-card); border-radius: var(--radius-lg);
      padding: 28px 22px; box-shadow: var(--shadow-card); text-align: center;
      animation: pop-in 420ms var(--ease) both;
    }
    .finale-card.wide { text-align: left; }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(18px) scale(.96); }
      to { opacity: 1; transform: none; }
    }
    .confetti { pointer-events: none; position: absolute; inset: 0; overflow: hidden; }
    .confetti i {
      position: absolute; top: -12px; width: 8px; height: 11px; border-radius: 2px;
      animation: fall 2.8s var(--ease) forwards;
    }
    @keyframes fall { to { transform: translateY(640px) rotate(200deg); opacity: 0; } }
    .display { font-size: 72px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
    .title-pill {
      display: inline-block; margin: 12px 0 4px; padding: 8px 14px;
      background: var(--color-lilac); border-radius: var(--radius-pill);
      font-weight: 800; font-size: 18px;
    }
    .bars { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; height: 168px; margin: 16px 0 8px; }
    .bars .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }

      flex: 1; width: 28px; background: var(--color-track); border-radius: var(--radius-pill);

function sampleCubic(p0, p1, p2, p3, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push({
      x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
      y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
    });
  }
  return pts;
}

function buildGraph() {
  const nodes = [];
  const MERGE = 16;
  function addNode(x, y, name) {
    for (const n of nodes) {
      if (Math.hypot(n.x - x, n.y - y) < MERGE) {
        n.x = (n.x + x) / 2; n.y = (n.y + y) / 2;
        if (name && !n.name) n.name = name;
        return n.id;
      }
    }
    const id = nodes.length;
    nodes.push({ id, x, y, name: name || null });
    return id;
  }
  const rawEdges = [];
  function link(a, b) {
    if (a === b) return;
    rawEdges.push([a, b]);
  }
  function addChain(pts) {
    let prev = null;
    for (const p of pts) {
      const id = addNode(p.x, p.y, p.name);
      if (prev != null) link(prev, id);
      prev = id;
    }
  }
  const beziers = [
    [{x:200,y:478},{x:198,y:400},{x:186,y:330},{x:206,y:250}],
    [{x:206,y:250},{x:220,y:190},{x:226,y:140},{x:220,y:100}],
    [{x:206,y:250},{x:140,y:248},{x:100,y:280},{x:96,y:318}],
    [{x:206,y:250},{x:280,y:246},{x:330,y:250},{x:348,y:290}],
    [{x:190,y:400},{x:160,y:396},{x:130,y:360},{x:112,y:354}],
    [{x:230,y:400},{x:270,y:390},{x:300,y:360},{x:278,y:368}],
    [{x:226,y:160},{x:270,y:150},{x:300,y:150},{x:306,y:162}],
    [{x:80,y:176},{x:90,y:200},{x:100,y:230},{x:96,y:270}],
  ];
  for (const b of beziers) addChain(sampleCubic(b[0], b[1], b[2], b[3], 16));
  const chains = [
    [{x:198,y:400},{x:230,y:400}],
    [{x:220,y:100},{x:170,y:86},{x:118,y:74}],
    [{x:220,y:100},{x:248,y:94},{x:270,y:90}],
    [{x:330,y:250},{x:348,y:220},{x:356,y:204}],
    [{x:348,y:290},{x:358,y:314}],
  ];
  for (const c of chains) addChain(c);
  for (const lm of LANDMARKS) addNode(lm.x, lm.y, lm.name);

  const stationNode = {};
  for (const s of STATIONS) {
    let best = 0, bd = 1e9;
    for (const n of nodes) {
      const d = Math.hypot(n.x - s.x, n.y - s.y);
      if (d < bd) { bd = d; best = n.id; }
    }
    const sid = addNode(s.x, s.y, s.name);
    link(sid, best);
    stationNode[s.id] = sid;
  }

  const adj = nodes.map(() => []);
  for (const [a, b] of rawEdges) {
    const w = Math.hypot(nodes[a].x - nodes[b].x, nodes[a].y - nodes[b].y);
    adj[a].push({ to:b, w });
    adj[b].push({ to:a, w });
  }
  return { nodes, adj, stationNode };
}

const GRAPH = buildGraph();

function shortestPath(fromId, toId) {
  const src = GRAPH.stationNode[fromId];
  const dst = GRAPH.stationNode[toId];
  if (src == null || dst == null) return [];
  if (src === dst) {
    const n = GRAPH.nodes[src];
    return [{ x:n.x, y:n.y, name:n.name }];
  }
  const N = GRAPH.nodes.length;
  const dist = Array(N).fill(Infinity);
  const prev = Array(N).fill(-1);
  const used = Array(N).fill(false);
  dist[src] = 0;
  for (let k = 0; k < N; k++) {
    let u = -1;
    for (let i = 0; i < N; i++) if (!used[i] && (u < 0 || dist[i] < dist[u])) u = i;
    if (u < 0 || dist[u] === Infinity) break;
    used[u] = true;
    if (u === dst) break;
    for (const e of GRAPH.adj[u]) {
      if (dist[u] + e.w < dist[e.to]) {
        dist[e.to] = dist[u] + e.w;
        prev[e.to] = u;
      }
    }
  }
  if (dist[dst] === Infinity) {
    const A = station(fromId), B = station(toId);
    return A && B ? [{x:A.x,y:A.y},{x:B.x,y:B.y}] : [];
  }
  const ids = [];
  for (let u = dst; u !== -1; u = prev[u]) ids.push(u);
  ids.reverse();
  return ids.map(i => ({ x: GRAPH.nodes[i].x, y: GRAPH.nodes[i].y, name: GRAPH.nodes[i].name }));
}

function graphDist(a, b) {
  return pathLen(shortestPath(a, b));
}
function pathLen(pts) {
  let n = 0;
  for (let i = 1; i < (pts || []).length; i++) n += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
  return n;
}
function headingOf(a, b) {
  return Math.atan2(b.x - a.x, a.y - b.y) * 180 / Math.PI;
}
function pointAlong(pts, dist) {
  if (!pts || !pts.length) return { x:200, y:472, heading:0 };
  if (pts.length === 1 || dist <= 0) {
    const h = pts[1] ? headingOf(pts[0], pts[1]) : 0;
    return { x: pts[0].x, y: pts[0].y, heading: h };
  }
  let left = dist;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
    if (left <= d || i === pts.length - 1) {
      const t = d < 0.001 ? 0 : Math.min(1, left / d);
      return {
        x: pts[i-1].x + (pts[i].x - pts[i-1].x) * t,
        y: pts[i-1].y + (pts[i].y - pts[i-1].y) * t,
        heading: headingOf(pts[i-1], pts[i]),

    }
    left -= d;
  }
}
function polylineTo(pts, dist) {
  const out = [];
  if (!pts || !pts.length) return out;
  out.push({ x: pts[0].x, y: pts[0].y });
  let left = dist;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
    if (left >= d) { out.push({ x: pts[i].x, y: pts[i].y }); left -= d; }
    else {
      const t = d < 0.001 ? 0 : left / d;
      out.push({ x: pts[i-1].x + (pts[i].x - pts[i-1].x) * t, y: pts[i-1].y + (pts[i].y - pts[i-1].y) * t });

    }
  }

}
function polylineFrom(pts, dist) {

  const start = pointAlong(pts, dist);
  const out = [{ x: start.x, y: start.y }];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
    if (acc + d >= dist - 0.01) out.push({ x: pts[i].x, y: pts[i].y });
    acc += d;
  }
  return out;
}
function pathD(pts) {
  if (!pts || pts.length < 2) return "";
  return pts.map((p,i) => `${i?"L":"M"}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
}
function distToSeg(p, a, b) {
  const vx = b.x-a.x, vy = b.y-a.y;
  const w = vx*vx + vy*vy;
  if (w < 1e-6) return Math.hypot(p.x-a.x, p.y-a.y);
  let t = ((p.x-a.x)*vx + (p.y-a.y)*vy) / w;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x+t*vx), p.y - (a.y+t*vy));
}
function simplify(pts, eps) {
  if (!pts || pts.length < 3) return (pts || []).slice();
  let idx = 0, maxd = 0;
  const a = pts[0], b = pts[pts.length-1];
  for (let i = 1; i < pts.length-1; i++) {
    const d = distToSeg(pts[i], a, b);
    if (d > maxd) { maxd = d; idx = i; }
  }
  if (maxd > eps) {
    const left = simplify(pts.slice(0, idx+1), eps);
    const right = simplify(pts.slice(idx), eps);
    return left.slice(0, -1).concat(right);
  }

}
function distToPointAlong(pts, p) {
  let best = 0, bd = 1e9, acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i-1], b = pts[i];
    const vx = b.x-a.x, vy = b.y-a.y;
    const w = vx*vx + vy*vy;
    const t = w < 1e-6 ? 0 : Math.max(0, Math.min(1, ((p.x-a.x)*vx + (p.y-a.y)*vy)/w));
    const qx = a.x + t*vx, qy = a.y + t*vy;
    const d = Math.hypot(p.x-qx, p.y-qy);
    if (d < bd) { bd = d; best = acc + Math.hypot(qx-a.x, qy-a.y); }

function fmtMeters(m) {

  if (m >= 20) m = Math.round(m / 10) * 10;
  return m + " m";
}
function instructionText(pts, dist, destName) {
  const total = pathLen(pts);
  const remain = total - dist;
  if (!pts || pts.length < 2 || remain <= ARRIVE) {
    return destName ? `Bạn đã tới ${destName}` : "Bạn đã tới nơi";
  }
  const simp = simplify(pts, 18);
  const turns = [];
  for (let i = 1; i < simp.length-1; i++) {
    const a = simp[i-1], b = simp[i], c = simp[i+1];
    const v1x = b.x-a.x, v1y = b.y-a.y, v2x = c.x-b.x, v2y = c.y-b.y;
    const mag = Math.hypot(v1x,v1y) * Math.hypot(v2x,v2y);
    if (mag < 1) continue;
    const ang = Math.acos(Math.max(-1, Math.min(1, (v1x*v2x + v1y*v2y) / mag))) * 180 / Math.PI;
    if (ang < 55) continue;
    const cross = v1x*v2y - v1y*v2x;
    const dir = cross > 0 ? "phải" : "trái";
    const along = distToPointAlong(pts, b);
    const lm = b.name || nearestLandmarkName(b);
    turns.push({ along, dir, landmark: lm });
  }
  const next = turns.find(t => t.along > dist + 10);
  if (!next) return `Đi thẳng tới ${destName}, còn ${fmtMeters(remain * M_PER_UNIT)}`;
  const toTurnM = (next.along - dist) * M_PER_UNIT;
  const where = next.landmark ? ` ở ${next.landmark}` : "";
  if (toTurnM < 28) return `Rẽ ${next.dir}${where}`;
  return `Đi thẳng ${fmtMeters(toTurnM)} rồi rẽ ${next.dir}${where}`;
}

function ensureRoute() {
  const key = state.currentId + ">" + state.nextId;
  if (state.routeKey === key && state.routePath && state.routePath.length) return;
  state.routeKey = key;
  const dest = station(state.nextId);
  const here = station(state.currentId) || station("b1");
  if (!dest) {
    state.routePath = [{ x: here.x, y: here.y }];
    state.walkDist = 0;
    state.arrived = true;
    state.userPos = { x: here.x, y: here.y };
    return;
  }
  if (here.id === dest.id) {
    state.routePath = [{ x: dest.x, y: dest.y }];
    state.walkDist = 0;
    state.arrived = true;
    state.userPos = { x: dest.x, y: dest.y };
    state.camMode = "follow";
    state.fitUntil = 0;
    return;
  }
  state.routePath = shortestPath(here.id, dest.id);
  state.walkDist = 0;
  state.arrived = pathLen(state.routePath) < ARRIVE;
  const pos = pointAlong(state.routePath, 0);
  state.userPos = { x: pos.x, y: pos.y };

function boundsOf(pts, pad=36) {

  if (w / h > aspect) h = w / aspect; else w = h * aspect;

    const showLabel = !isHere && (isNext || isDone || (showAllLabels && !faded && keyLabels.includes(s.id)));

  let routes = "";

function paintNav() {
  const svg = $("#mapSvg");
  if (!svg) return;
  svg.setAttribute("viewBox", `${cam.x.toFixed(1)} ${cam.y.toFixed(1)} ${cam.w.toFixed(1)} ${cam.h.toFixed(1)}`);
  const walked = pathD([...(state.trail || []), ...polylineTo(state.routePath, state.walkDist || 0)]);
  const remain = pathD(polylineFrom(state.routePath, state.walkDist || 0));
  const tw = $("#routeWalked");
  const tr = $("#routeRemain");
  if (tw) tw.setAttribute("d", walked);
  if (tr) tr.setAttribute("d", remain);
  const puck = $("#userPuck");
  if (puck && state.userPos) {
    puck.setAttribute("transform", `translate(${state.userPos.x},${state.userPos.y}) rotate(${state.heading || 0})`);
  }
  const dest = station(state.nextId);
  const total = pathLen(state.routePath);
  const remainU = Math.max(0, total - (state.walkDist || 0));
  const meters = Math.round(remainU * M_PER_UNIT);
  const mins = Math.max(1, Math.round(meters / 72));
  const banner = $("#navBannerText");
  if (banner) banner.textContent = instructionText(state.routePath, state.walkDist || 0, dest && dest.name);
  const turnIco = $("#navTurnIco");
  if (turnIco) {
    const txt = banner ? banner.textContent : "";
    turnIco.textContent = txt.includes("trái") ? "↰" : txt.includes("phải") ? "↱" : "↑";
  }
  const eta = $("#navEta");
  if (eta) {
    eta.textContent = state.arrived || meters <= 25
      ? "Bạn đang đứng tại trạm"
      : `${fmtMeters(meters)} · khoảng ${mins === 1 && meters < 80 ? "dưới 1" : mins} phút đi bộ`;
  }
  const cta = $("#navCta");
  const close = state.arrived || meters <= 25;
  if (cta) {
    cta.hidden = !close;
    cta.disabled = !close;
  }
  const skip = $("#navSkipWalk");
  if (skip) skip.hidden = !state.walkPaused || close;
}

function stopNavRuntime() {
  if (navRaf) cancelAnimationFrame(navRaf);
  navRaf = 0;
}
function startNavRuntime() {
  stopNavRuntime();
  camTarget = targetCam();
  cam = { ...camTarget };
  lastNavTs = performance.now();
  const svg = $("#mapSvg");
  bindMapPan(svg);
  paintNav();
  function loop(now) {
    if (state.screen !== "nav") return;
    const dt = Math.min(0.05, (now - lastNavTs) / 1000);
    lastNavTs = now;
    if (state.fitUntil && Date.now() >= state.fitUntil && state.camMode === "fit") {
      state.camMode = "follow";
    }
    if (!state.arrived && !state.walkPaused) {
      const total = pathLen(state.routePath);
      const speed = state.walkSpeed || WALK_SPEED;
      state.walkDist = Math.min(total, (state.walkDist || 0) + speed * dt);
      const pos = pointAlong(state.routePath, state.walkDist);
      state.userPos = { x: pos.x, y: pos.y };
      state.heading = pos.heading;
      if (total - state.walkDist <= ARRIVE) {
        state.arrived = true;
        const dest = station(state.nextId);
        if (dest) state.userPos = { x: dest.x, y: dest.y };
      }
    }
    camTarget = targetCam();
    const k = reduceMotion() ? 1 : 0.14;
    cam.x += (camTarget.x - cam.x) * k;
    cam.y += (camTarget.y - cam.y) * k;
    cam.w += (camTarget.w - cam.w) * k;
    cam.h += (camTarget.h - cam.h) * k;
    paintNav();
    navRaf = requestAnimationFrame(loop);
  }
  navRaf = requestAnimationFrame(loop);
}
function bindMapPan(svg) {
  if (!svg || svg._panBound) return;
  svg._panBound = true;
  let dragging = false, lx = 0, ly = 0;
  svg.addEventListener("pointerdown", (e) => {
    dragging = true; lx = e.clientX; ly = e.clientY;
    try { svg.setPointerCapture(e.pointerId); } catch {}
  });
  svg.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (Math.abs(dx) + Math.abs(dy) < 2) return;
    state.camMode = "free";
    const k = cam.w / (svg.clientWidth || 390);
    camTarget = { ...cam, x: cam.x - dx * k, y: cam.y - dy * k };
    camTarget = clampCam(camTarget);
    lx = e.clientX; ly = e.clientY;
  });
  const end = () => { dragging = false; };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
}

function parseDob(dob) {
  const m = String(dob || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return { y:"", m:"", d:"" };
  return { y: m[1], m: String(+m[2]), d: String(+m[3]) };
}
function isValidDob(y, mo, d) {
  y = +y; mo = +mo; d = +d;
  if (!y || !mo || !d) return false;
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return false;
  if (dt > new Date()) return false;
  if (y < 1920) return false;
  return true;
}
function dobSelects() {
  const dob = parseDob(state.user.dob);
  const yearNow = new Date().getFullYear();
  const dayOpts = [`<option value="">Ngày</option>`].concat(
    Array.from({ length: 31 }, (_, i) => {
      const v = String(i + 1);
      const label = String(i + 1).padStart(2, "0");
      return `<option value="${v}" ${dob.d===v?"selected":""}>${label}</option>`;
    })
  ).join("");
  const monthOpts = [`<option value="">Tháng</option>`].concat(
    Array.from({ length: 12 }, (_, i) => {
      const v = String(i + 1);
      const label = String(i + 1).padStart(2, "0");
      return `<option value="${v}" ${dob.m===v?"selected":""}>${label}</option>`;
    })
  ).join("");
  const years = [];
  for (let y = yearNow - 4; y >= 1926; y--) years.push(y);
  const yearOpts = [`<option value="">Năm</option>`].concat(
    years.map(y => `<option value="${y}" ${dob.y===String(y)?"selected":""}>${y}</option>`)
  ).join("");
  return { dayOpts, monthOpts, yearOpts };
}

    const img = state.photoDraft

      : `<div class="ph">${iconSvg(s.icon, 64)}<div style="margin-top:8px">${esc(s.photoHint || "Chụp một tấm là xong")}</div></div>`;
    body = `<p class="lead">${esc(s.prompt)}</p>

function choiceCaption(c) {
  if (!c.choice) return "";
  if (c.choice === "timeout") return " · hết giờ";
  const s = station(c.id);
  const pool = [...(s && s.choices || []), ...M4_ANIMAL, ...((s && s.quiz && s.quiz.answers) || [])];
  const found = pool.find(x => x.id === c.choice);
  return found ? " · " + esc(found.t) : "";
}
function computeTitle() {
  const ids = state.completed.map(c => c.id);
  if (ids.includes("duoiuoi")) return "Thánh săn đười ươi";
  if (ids.includes("b2") && ids.filter(id => station(id).mission === "M3").length >= 2) return "Tín đồ sống ảo";
  if (state.completed.length >= 12) return "Nhà thám hiểm";
  if (state.desiredTitle && state.desiredTitle !== "Chơi thử") return state.desiredTitle;
  const types = new Set(state.completed.map(c => c.mission));
  if (types.size >= 5) return "Nhà sưu tầm nhiệm vụ";
  return "Người khám phá";
}
function rankInfo() {
  const mail = state.user.email || "ban";
  const seed = (mail.length * 7 + state.completed.length * 13 + (mail.charCodeAt(0) || 1)) % 40;
  return { rank: 12 + seed, total: 148 + ((mail.charCodeAt(0) || 1) % 28) };
}
function typeBreakdown() {
  const counts = { M1:0, M2:0, M3:0, M4:0, M5:0, break:0 };
  for (const c of state.completed) {
    const s = station(c.id);
    if (s && s.kind === "break") counts.break++;
    counts[c.mission] = (counts[c.mission] || 0) + 1;
  }
  const total = Math.max(1, state.completed.length);
  const colors = { M1:"var(--color-butter)", M2:"var(--color-peach)", M3:"var(--color-brown)", M4:"var(--color-olive)", M5:"var(--color-lilac)", break:"var(--color-accent)" };
  const labels = { M1:"Tìm thấy", M2:"Đoán nhanh", M3:"Bắt chước", M4:"Quan sát", M5:"Hồ sơ", break:"Check-in" };
  return ["M4","M2","M1","M3","M5"].map(k => ({
    key:k, label:labels[k], pct: Math.round((counts[k] || 0) / total * 100), color: colors[k],
  })).filter(x => x.pct > 0 || state.completed.some(c => c.mission === x.key));
}

function secretIdolUnlocked() {
  return state.completed.some(c => c.id === "duoiuoi") || state.completed.length >= 6;
}

}

}

function storyFilename(kind) {

    frame: "choo-zoo-frame.png",
  })[kind] || "choo-zoo.png";
}
function fillRoundRect(ctx, x, y, w, h, r, color) {
  ctx.fillStyle = color;
  roundRect(ctx, x, y, w, h, r);
  ctx.fill();
}
function canvasToBlob(canvas) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error("blob")), "image/png");
  });
}
function triggerDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2500);
}
function lastPhoto() {
  const photos = (state.completed || []).map(x => x.photo).filter(Boolean);
  return photos[photos.length - 1] || "";
}
function todayLabel() {
  return new Date().toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "Asia/Saigon" });
}
async function waitFonts() {
  if (!(document.fonts && document.fonts.ready)) return;
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load('800 72px "Be Vietnam Pro"'),
        document.fonts.load('600 28px "Be Vietnam Pro"'),
        document.fonts.load('500 24px "Be Vietnam Pro"'),
        document.fonts.ready,
      ]),
      new Promise(r => setTimeout(r, 2500)),
    ]);
  } catch (e) {}
}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("img"));
    img.src = src;
  });
}
async function makeStoryCanvas(kind) {
  await waitFonts();
  const W = 1080, H = 1920;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#F1F0EC";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#F0D5CC";
  ctx.beginPath(); ctx.arc(930, 160, 230, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#D3DEC4";
  ctx.beginPath(); ctx.arc(70, 1720, 280, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#E0D4EE";
  ctx.beginPath(); ctx.arc(990, 1540, 190, 0, Math.PI * 2); ctx.fill();

  fillRoundRect(ctx, 80, 84, 340, 56, 28, "#E8C75A");
  ctx.fillStyle = "#1C1B19";
  ctx.font = '600 24px "Be Vietnam Pro", sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Thảo Cầm Viên", 250, 113);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.font = '800 72px "Be Vietnam Pro", sans-serif';
  ctx.fillText("Choo Zoo", 80, 230);

  const who = displayName();
  const title = computeTitle();
  const rank = rankInfo();
  const HEX = { M1: "#E8C75A", M2: "#F0D5CC", M3: "#7A5340", M4: "#6B7F45", M5: "#E0D4EE" };

  if (kind === "title") {
    ctx.font = '500 28px "Be Vietnam Pro", sans-serif';
    ctx.fillStyle = "#4A4640";
    ctx.fillText("Danh hiệu của " + who, 80, 320);
    fillRoundRect(ctx, 80, 380, 920, 180, 90, "#E0D4EE");
    ctx.fillStyle = "#1C1B19";
    ctx.font = '800 46px "Be Vietnam Pro", sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(title, 540, 470);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    if (secretIdolUnlocked()) {
      fillRoundRect(ctx, 80, 620, 920, 300, 36, "#E8C75A");
      ctx.font = '600 22px "Be Vietnam Pro", sans-serif';
      ctx.fillStyle = "#4A4640";
      ctx.fillText("Thẻ idol bí mật", 130, 690);
      ctx.fillStyle = "#1C1B19";
      ctx.font = '800 48px "Be Vietnam Pro", sans-serif';
      ctx.fillText("Em Trò", 130, 760);
      ctx.font = '500 26px "Be Vietnam Pro", sans-serif';
      ctx.fillText("Đười ươi  ·  16.08.2006", 130, 812);
      ctx.fillText("Hay trèo cao nhìn người qua đường.", 130, 858);
    }
  } else if (kind === "ranking") {
    ctx.font = '500 28px "Be Vietnam Pro", sans-serif';
    ctx.fillStyle = "#4A4640";
    ctx.fillText("Hạng hôm nay", 80, 320);
    ctx.fillStyle = "#1C1B19";
    ctx.font = '800 150px "Be Vietnam Pro", sans-serif';
    ctx.fillText("#" + rank.rank, 80, 500);
    ctx.font = '500 32px "Be Vietnam Pro", sans-serif';
    ctx.fillStyle = "#4A4640";
    ctx.fillText("trên " + rank.total + " người chơi", 80, 568);
    fillRoundRect(ctx, 80, 640, 920, 760, 40, "#FFFFFF");
    ctx.fillStyle = "#1C1B19";
    ctx.font = '800 34px "Be Vietnam Pro", sans-serif';
    ctx.fillText("Hành trình hôm nay", 130, 710);
    const bars = typeBreakdown();
    const barW = 86;
    const usable = 800;
    const gap = bars.length > 1 ? (usable - bars.length * barW) / (bars.length - 1) : 0;
    bars.forEach((b, i) => {
      const x = 140 + i * (barW + gap);
      const trackH = 440;
      const trackY = 760;
      fillRoundRect(ctx, x, trackY, barW, trackH, 40, "#F3F1ED");
      const fh = Math.max(40, trackH * (b.pct / 100));
      fillRoundRect(ctx, x, trackY + trackH - fh, barW, fh, 40, HEX[b.key] || "#E0B034");
      ctx.fillStyle = "#1C1B19";
      ctx.textAlign = "center";
      ctx.font = '700 22px "Be Vietnam Pro", sans-serif';
      ctx.fillText(b.pct + "%", x + barW / 2, trackY + trackH + 42);
      ctx.font = '600 20px "Be Vietnam Pro", sans-serif';
      ctx.fillText(b.label, x + barW / 2, trackY + trackH + 72);
    });
    ctx.textAlign = "left";
  } else if (kind === "frame") {
    fillRoundRect(ctx, 80, 300, 920, 1280, 40, "#FFFFFF");
    ctx.fillStyle = "#E8C75A";
    ctx.beginPath();
    roundRect(ctx, 80, 300, 920, 190, 40);
    ctx.fill();
    ctx.fillRect(80, 430, 920, 60);
    ctx.fillStyle = "#1C1B19";
    ctx.font = '800 56px "Be Vietnam Pro", sans-serif';
    ctx.fillText("Choo Zoo", 124, 400);
    ctx.font = '600 24px "Be Vietnam Pro", sans-serif';
    ctx.fillText("Thảo Cầm Viên Sài Gòn", 128, 446);
    const px = 130, py = 540, pw = 820, ph = 720;
    fillRoundRect(ctx, px, py, pw, ph, 32, "#D2C8BA");
    const photo = lastPhoto();
    if (photo) {
      try {
        const img = await loadImage(photo);
        ctx.save();
        roundRect(ctx, px, py, pw, ph, 32);
        ctx.clip();
        const s = Math.max(pw / img.width, ph / img.height);
        const dw = img.width * s, dh = img.height * s;
        ctx.drawImage(img, px + (pw - dw) / 2, py + (ph - dh) / 2, dw, dh);
        ctx.restore();
      } catch (e) {}
    } else {
      ctx.fillStyle = "#4A4640";
      ctx.font = '600 32px "Be Vietnam Pro", sans-serif';
      ctx.textAlign = "center";
      ctx.fillText("Hành trình Thảo Cầm Viên", 540, 900);
      ctx.textAlign = "left";
    }
    ctx.fillStyle = "#1C1B19";
    ctx.font = '600 26px "Be Vietnam Pro", sans-serif';
    ctx.fillText(who, 130, 1330);
    ctx.font = '800 42px "Be Vietnam Pro", sans-serif';
    ctx.fillText(title, 130, 1390);
    ctx.fillStyle = "#4A4640";
    ctx.font = '500 24px "Be Vietnam Pro", sans-serif';
    ctx.fillText(state.completed.length + " trạm  ·  " + todayLabel(), 130, 1440);
    const names = state.completed.map(x => station(x.id).short);
    let line = "", yNames = 1484;
    names.forEach((n, i) => {
      const next = line ? line + "  ·  " + n : n;
      if (ctx.measureText(next).width > 780 && line) {
        ctx.fillText(line, 130, yNames);
        yNames += 36;
        line = n;
      } else line = next;
    });
    if (line) ctx.fillText(line, 130, yNames);
    fillRoundRect(ctx, 700, 1310, 240, 64, 32, "#E0B034");
    ctx.fillStyle = "#1C1B19";
    ctx.font = '800 24px "Be Vietnam Pro", sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const last = state.completed[state.completed.length - 1];
    ctx.fillText(last ? rarityOf(station(last.id)) : "Thường", 820, 1342);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  ctx.fillStyle = "#4A4640";
  ctx.font = '500 22px "Be Vietnam Pro", sans-serif';
  ctx.fillText(who + "  ·  Choo Zoo", 80, 1848);
  ctx.fillText(todayLabel(), 80, 1884);
  return c;
}
async function saveStory(kind, mode) {
  try {
    const canvas = await makeStoryCanvas(kind);
    const blob = await canvasToBlob(canvas);
    const file = new File([blob], storyFilename(kind), { type: "image/png" });
    if (mode === "download") {
      triggerDownload(blob, file.name);
      toast("Đã lưu ảnh về máy");
      return;
    }
    const canFiles = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    if (navigator.share && canFiles) {
      try {
        await navigator.share({
          files: [file],
          title: "Choo Zoo",
          text: "Hành trình của mình ở Thảo Cầm Viên",
        });
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }
    state.shareSheet = kind;
    save();
    render();
  } catch (e) {
    console.error(e);
    toast("Chưa tạo được ảnh, thử lại nha");
  }
}
async function finishSharePick(dest) {
  const kind = state.shareSheet || "title";
  state.shareSheet = "";
  save();
  render();
  try {
    const canvas = await makeStoryCanvas(kind);
    const blob = await canvasToBlob(canvas);
    triggerDownload(blob, storyFilename(kind));
  } catch (e) {}
  if (dest === "save") {
    toast("Đã lưu ảnh về máy");
    return;
  }
  try {
    window.open(dest === "stories" ? "instagram://story-camera" : "instagram://app", "_blank", "noopener");
  } catch (e) {}
  setTimeout(() => {
    try { window.open("https://www.instagram.com/", "_blank", "noopener"); } catch (e) {}
  }, 280);
  toast("Ảnh đã lưu. Mở Instagram, chọn tin hoặc bài viết mới, rồi chọn ảnh vừa tải");
}

          <p class="tiny">Đười ươi · 16.08.2006<br/>Hay trèo cao nhìn người qua đường.</p>
        </div>
      </div>` : ""}
      <button class="btn" style="margin-top:20px" data-act="finale-next">Xem xếp hạng</button>
      ${shareActions("title")}
    </div>`;
  } else if (step === 3) {
    const bars = typeBreakdown();
    inner = `<div class="finale-card wide" data-finale="ranking">
      <p class="tiny">Hạng hôm nay</p>
      <div class="display" style="font-size:56px;text-align:center">#${rank.rank}</div>
      <p class="lead" style="text-align:center">trên ${rank.total} người chơi</p>
      <h3 style="margin-top:16px">Hành trình hôm nay</h3>
      <div class="bars">
        ${bars.map(b => `<div class="col">
          <div class="track"><div class="fill" style="height:${Math.max(12,b.pct)}%;background:${b.color}"></div></div>
          <label>${b.pct}%<br/>${esc(b.label)}</label>
        </div>`).join("")}
      </div>
      <button class="btn" data-act="finale-next">Nhận frame ảnh</button>
      ${shareActions("ranking")}
    </div>`;
  } else if (step === 4) {
    inner = `<div class="finale-card" data-finale="frame">
      <h1>Frame kỷ niệm</h1>
      <p class="lead" style="margin:8px 0 14px">Tải về máy để giữ lại vòng đi hôm nay.</p>
      <canvas id="frameCanvas" width="360" height="450" style="width:168px;height:210px;display:block;margin:0 auto;border-radius:18px;box-shadow:var(--shadow-card)"></canvas>
      <button class="btn" style="margin-top:16px" data-act="finale-next">Kết thúc</button>
      ${shareActions("frame")}
    </div>`;
  } else {
    inner = `<div class="finale-card" data-finale="end">
      <h1>Hẹn gặp lại ở Thảo Cầm Viên</h1>
      <p class="lead" style="margin-top:12px">Tiến độ trên máy này có thể xóa để chơi vòng mới.</p>
      <button class="btn" style="margin-top:22px" data-act="replay">Chơi lại từ đầu</button>
    </div>`;
  }
  const confetti = step === 0 ? `<div class="confetti" aria-hidden="true">${Array.from({length:22}, (_,i) => {
    const cols = ["#E0B034","#F0D5CC","#E0D4EE","#D3DEC4","#E8C75A","#D2C8BA"];
    return `<i style="left:${4+i*4.4}%;animation-delay:${(i%8)*0.09}s;background:${cols[i%cols.length]}"></i>`;
  }).join("")}</div>` : "";
  return `<div class="screen finale" data-screen="finale" data-step="${step}">
    ${topbar("Tổng kết")}
    ${confetti}
    ${inner}
  </div>`;
}

function overlays() {
  let html = "";
  html += renderNfcOverlay();
  if (state.shareSheet) {
    html += `<div class="overlay sheet" data-act="close-share">
      <div class="share-sheet" data-share-sheet="${state.shareSheet}" onclick="if (!event.target.closest('[data-act]')) event.stopPropagation()">
        <div class="grab"></div>
        <h3>Chia sẻ lên Instagram</h3>
        <p class="muted">Chọn nơi muốn đăng, hoặc lưu ảnh về máy</p>
        <button class="share-opt" type="button" data-act="share-pick" data-dest="stories">
          <span class="glyph">${cameraIcon()}</span>
          <span><strong>Instagram Stories</strong><em>Đăng ảnh như một tin 24 giờ</em></span>
        </button>
        <button class="share-opt" type="button" data-act="share-pick" data-dest="feed">
          <span class="glyph">${cameraIcon()}</span>
          <span><strong>Instagram Feed</strong><em>Đăng lên trang cá nhân</em></span>
        </button>
        <button class="share-opt" type="button" data-act="share-pick" data-dest="save">
          <span class="glyph save">${downloadIcon()}</span>
          <span><strong>Lưu về máy</strong><em>Tải ảnh rồi tự đăng sau</em></span>
        </button>
      </div>
    </div>`;
  }
  if (state.help || state.showHowto) {
    html += `<div class="overlay" data-act="close-help"><div class="modal" onclick="event.stopPropagation()">
      <h2>Cách chơi</h2>
      <ol class="howto">
        <li>Chọn số nhiệm vụ và các trạm muốn ghé.</li>
        <li>Theo đường chỉ dẫn trên map, giống khi đi bộ với bản đồ.</li>
        <li>Chạm NFC hoặc quét QR tại trạm để mở nhiệm vụ.</li>
        <li>Làm xong, map dẫn tới trạm gần nhất còn lại.</li>
      </ol>
      <p class="tiny" style="margin-bottom:14px">Một tay là đủ. Có năm mẫu: tìm và chụp, đoán nhanh, bắt chước, quan sát, và mở hồ sơ idol. Không thấy thú thì dùng Quan sát.</p>
      <button class="btn" data-act="close-help">Đã hiểu</button>
    </div></div>`;
  }
  if (state.paused) {
    html += `<div class="overlay center"><div class="modal">
      <h2>Đang tạm dừng</h2>
      <p class="lead" style="margin:10px 0 16px">Tiến độ đã lưu trên máy này. Tắt máy hay đổi tab vẫn quay lại được.</p>
      <button class="btn" data-act="resume">Tiếp tục</button>
      <button class="btn ghost" style="margin-top:10px" data-act="reset">Thoát và xóa tiến độ</button>
    </div></div>`;
  }
  return html;
}

function render() {
  const toastEl = $("#toast");
  if (toastEl) toastEl.style.display = "none";
  if (state.screen !== "nav") stopNavRuntime();
  if (state.screen === "nav") ensureRoute();
  const root = $("#app");
  root.classList.remove("is-leaving");
  let html = "";
  switch (state.screen) {
    case "login": html = renderLogin(); break;
    case "profile": html = renderProfile(); break;
    case "start": html = renderStart(); break;
    case "map": html = renderMapPreview(); break;
    case "choose": html = renderChoose(); break;
    case "nav": html = renderNav(); break;
    case "mission": html = renderMission(); break;
    case "finale": html = renderFinale(); break;
    default: html = renderLogin();
  }
  root.innerHTML = html + overlays();
  if (state.screen === "nav") startNavRuntime();
  if (state.screen === "finale" && state.finaleStep === 4) drawFrame(false);
  if (state.screen === "finale") armFinaleAdvance();
  if (state.screen === "mission" && missionType(station(state.nextId) || {}) === "M2") startQuizTimer();
  bind();
}

function openMission() {
  state.fallbackM4 = false;
  state.photoDraft = null;
  state.frameMode = "solo";
  state.idolOpen = false;
  state.quizLocked = false;
  state.quizPicked = null;
  state.nfcBusy = false;
  go("mission");
}

function completeMission(extra={}) {
  const id = state.nextId;
  const s = station(id);
  if (!s) return;
  if (!state.completed.some(c => c.id === id)) {
    state.completed.push({
      id, mission: extra.mission || missionType(s),
      choice: extra.choice || null,
      photo: extra.photo || state.photoDraft || null,
      frameMode: state.frameMode,
      at: Date.now(),
    });
  }
  if (state.routePath && state.routePath.length) {
    state.trail = (state.trail || []).concat(state.routePath);
  }
  state.currentId = id;
  state.photoDraft = null;
  state.fallbackM4 = false;
  state.idolOpen = false;
  state.quizLocked = false;
  const nxt = nextInPlan(id);
  if (!nxt) {
    state.finaleStep = 0;
    go("finale");
    return;
  }
  state.nextId = nxt;
  state.routeKey = "";
  go("nav");
  const ns = station(nxt);
  if (ns) toast("Trạm tiếp theo: " + ns.name + " · " + MISSION_NAME[ns.mission]);
}

function simulatePhoto(s) {
  const c = document.createElement("canvas");
  c.width = 720; c.height = 900;
  const ctx = c.getContext("2d");
  const g = ctx.createLinearGradient(0,0,0,900);
  g.addColorStop(0, "#E8C75A");
  g.addColorStop(1, "#D3DEC4");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,720,900);
  ctx.fillStyle = "rgba(28,27,25,.08)";
  ctx.beginPath(); ctx.arc(360, 380, 160, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#1C1B19";
  ctx.font = '700 36px "Be Vietnam Pro", sans-serif';
  ctx.textAlign = "center";
  ctx.fillText(s.name, 360, 640);
  ctx.font = '500 22px "Be Vietnam Pro", sans-serif';
  ctx.fillText("Choo Zoo · bản chạy thử", 360, 680);
  return c.toDataURL("image/jpeg", 0.72);
}

function startQuizTimer() {
  clearInterval(startQuizTimer._id);
  if (state.quizLocked) return;
  if (!state.quizDeadline || state.quizDeadline < Date.now()) state.quizDeadline = Date.now() + 10000;
  const tick = () => {
    const bar = $("#quizBar");
    const label = $("#quizTime");
    const left = Math.max(0, state.quizDeadline - Date.now());
    const pct = left / 10000;
    if (bar) bar.style.transform = `scaleX(${pct})`;
    if (label) label.textContent = left <= 0 ? "Hết giờ rồi" : `Còn ${Math.ceil(left/1000)} giây`;
    if (left <= 0 && !state.quizLocked) {
      clearInterval(startQuizTimer._id);
      finishQuiz(null);
    }
  };
  tick();
  startQuizTimer._id = setInterval(tick, 100);
}

function finishQuiz(choiceId) {
  if (state.quizLocked) return;
  const s = station(state.nextId);
  const quiz = s && s.quiz;
  state.quizLocked = true;
  state.quizPicked = choiceId;
  clearInterval(startQuizTimer._id);
  save();
  render();
  setTimeout(() => completeMission({ mission:"M2", choice: choiceId || "timeout" }), 1100);
}

let finaleTimer = 0;
function armFinaleAdvance() {
  clearTimeout(finaleTimer);
  if (state.screen !== "finale") return;
  if (state.shareSheet) return;
  if (state.finaleStep >= 2) return;
  finaleTimer = setTimeout(() => {
    if (state.screen !== "finale") return;
    if (state.shareSheet) return;
    state.finaleStep = (state.finaleStep || 0) + 1;
    save(); render();
  }, 4500);
}

function drawFrame(download) {
  const canvas = $("#frameCanvas");
  if (!canvas) return;
  const paint = () => drawFrameNow(download);
  if (document.fonts && document.fonts.status !== "loaded") {
    document.fonts.ready.then(paint).catch(paint);
    return;
  }
  paint();
}
function drawFrameNow(download) {
  const canvas = $("#frameCanvas");
  if (!canvas) return;
  const c = document.createElement("canvas");
  c.width = 1080; c.height = 1350;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#F1F0EC";
  ctx.fillRect(0,0,1080,1350);
  ctx.fillStyle = "#E8C75A";
  ctx.fillRect(0,0,1080,220);
  ctx.fillStyle = "#1C1B19";
  ctx.font = '800 72px "Be Vietnam Pro", sans-serif';
  ctx.fillText("Choo Zoo", 80, 130);
  ctx.font = '600 28px "Be Vietnam Pro", sans-serif';
  ctx.fillText("Thảo Cầm Viên Sài Gòn", 82, 176);

  const photos = state.completed.map(x => x.photo).filter(Boolean);
  const px = 80, py = 260, pw = 920, ph = 700;
  ctx.fillStyle = "#D2C8BA";
  roundRect(ctx, px, py, pw, ph, 36); ctx.fill();

  const paintPhoto = () => {
    ctx.fillStyle = "#1C1B19";
    ctx.font = '600 26px "Be Vietnam Pro", sans-serif';
    ctx.fillText(displayName(), 80, 1018);
    ctx.font = '700 42px "Be Vietnam Pro", sans-serif';
    ctx.fillText(computeTitle(), 80, 1068);
    ctx.font = '500 26px "Be Vietnam Pro", sans-serif';
    ctx.fillStyle = "#4A4640";
    ctx.fillText(state.completed.length + " trạm · " + new Date().toLocaleDateString("vi-VN", { timeZone: "Asia/Saigon" }), 80, 1090);
    ctx.fillText(state.completed.map(x => station(x.id).short).join("  ·  "), 80, 1136);
    ctx.fillStyle = "#E0B034";
    roundRect(ctx, 760, 1008, 240, 64, 32); ctx.fill();
    ctx.fillStyle = "#1C1B19";
    ctx.font = '800 26px "Be Vietnam Pro", sans-serif';
    const last = state.completed[state.completed.length-1];
    const rare = last ? rarityOf(station(last.id)) : "Thường";
    ctx.fillText(rare, 820, 1050);
    ctx.font = '600 22px "Be Vietnam Pro", sans-serif';
    ctx.fillText("Bản chạy thử Choo Zoo", 80, 1268);

    const view = $("#frameCanvas");
    if (!view) return;
    const vctx = view.getContext("2d");
    vctx.drawImage(c, 0, 0, view.width, view.height);
    if (download) {
      const a = document.createElement("a");
      a.href = c.toDataURL("image/png");
      a.download = "choo-zoo-frame.png";
      a.click();
    }
  };

  if (photos.length) {
    const img = new Image();
    img.onload = () => {
      ctx.save();
      roundRect(ctx, px, py, pw, ph, 36); ctx.clip();
      ctx.drawImage(img, px, py, pw, ph);
      ctx.restore();
      paintPhoto();
    };
    img.onerror = paintPhoto;
    img.src = photos[photos.length-1];
  } else {
    ctx.fillStyle = "#4A4640";
    ctx.font = '600 34px "Be Vietnam Pro", sans-serif';
    ctx.textAlign = "center";
    ctx.fillText("Hành trình Thảo Cầm Viên", 540, 580);
    ctx.fillText(state.completed.map(x => station(x.id).short).slice(0,6).join("   "), 540, 640);
    ctx.textAlign = "left";
    paintPhoto();
  }
}
function roundRect(ctx,x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function beginJourney() {
  go("choose");
}
function startNavFromChoose() {
  if (state.selected.length < 3) return;
  state.currentId = "b1";
  state.trail = [];
  state.completed = state.completed || [];
  const first = nextInPlan("b1");
  state.nextId = first;
  state.routeKey = "";
  state.userPos = { x: 200, y: 472 };
  go("nav");
}

function showNfcThenMission() {
  state.nfcBusy = true;
  save();
  render();
  setTimeout(() => { state.nfcBusy = false; openMission(); }, 720);
}

function bind() {
  const root = $("#app");
  root.onclick = (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === "send-link") {
      const email = ($("#email")?.value || "").trim();
      state.user.email = email;
      if (!validEmail(email)) { toast("Mail chưa đúng định dạng"); return; }
      toast("Đã gửi link tới " + email);
      go("profile");
      return;
    }
    if (act === "back-login") { go("login"); return; }
    if (act === "save-profile") {
      const name = ($("#uname")?.value || "").trim();
      const d = $("#dob-d")?.value || "";
      const mo = $("#dob-m")?.value || "";
      const y = $("#dob-y")?.value || "";
      if (!name) { toast("Cho em biết bạn muốn được gọi là gì"); return; }
      if (!isValidDob(y, mo, d)) { toast("Ngày sinh chưa đúng, chọn ngày / tháng / năm nha"); return; }
      state.user.name = name;
      state.user.dob = `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      save();
      go("start");
      return;
    }
    if (act === "begin" || act === "noop") { if (act === "begin") beginJourney(); return; }
    if (act === "to-start") { go("start"); return; }
    if (act === "to-map") { go("map"); return; }
    if (act === "howto") { state.showHowto = true; save(); render(); return; }
    if (act === "play-demo") {
      const g = GOALS[0];
      state.goalId = g.id;
      state.targetCount = g.count;
      state.desiredTitle = g.title;
      state.selected = g.pick.slice();
      go("choose");
      return;
    }
    if (act === "pick-goal") {
      const g = GOALS.find(x => x.id === btn.dataset.goal);
      if (!g) return;
      state.goalId = g.id;
      state.targetCount = g.count;
      state.desiredTitle = g.title;
      state.selected = g.pick.slice();
      save(); render();
      return;
    }
    if (act === "toggle") {
      const id = btn.dataset.id;
      if (state.selected.includes(id)) state.selected = state.selected.filter(x => x !== id);
      else state.selected.push(id);
      save(); render();
      return;
    }
    if (act === "to-nav") { startNavFromChoose(); return; }
    if (act === "recenter") {
      state.camMode = "follow";
      camTarget = targetCam();
      return;
    }
    if (act === "arrive-nfc" || act === "qr") {
      if (act === "qr") toast("QR giả lập, mở nhiệm vụ");
      const total = pathLen(state.routePath);
      const remainU = Math.max(0, total - (state.walkDist || 0));
      if (!state.arrived && remainU > 25 && act !== "qr") return;
      showNfcThenMission();
      return;
    }
    if (act === "skip-walk") {
      const total = pathLen(state.routePath);
      state.walkDist = total;
      state.arrived = true;
      const dest = station(state.nextId);
      if (dest) state.userPos = { x: dest.x, y: dest.y };
      state.walkPaused = false;
      paintNav();
      return;
    }
    if (act === "choose") {
      completeMission({ mission: "M4", choice: btn.dataset.choice });
      return;
    }
    if (act === "quiz") {
      finishQuiz(btn.dataset.choice);
      return;
    }
    if (act === "flip-idol") {
      state.idolOpen = true; save(); render(); return;
    }
    if (act === "finish-idol") {
      completeMission({ mission: "M5" }); return;
    }
    if (act === "camera") {
      const s = station(state.nextId);
      state.photoDraft = simulatePhoto(s);
      save(); render();
      const input = $("#shot");
      if (input) input.value = "";
      return;
    }
    if (act === "finish-photo") {
      completeMission({ photo: state.photoDraft });
      return;
    }
    if (act === "fallback") {
      state.fallbackM4 = true;
      state.photoDraft = null;
      save(); render();
      return;
    }
    if (act === "frame") {
      state.frameMode = btn.dataset.mode;
      save(); render();
      return;
    }
    if (act === "help") { state.help = true; save(); render(); return; }
    if (act === "close-help") { state.help = false; state.showHowto = false; save(); render(); return; }
    if (act === "pause") { state.paused = true; save(); render(); return; }
    if (act === "resume") { state.paused = false; save(); render(); return; }
    if (act === "reset") { stopNavRuntime(); state = defaultState(); save(); render(); return; }
    if (act === "download") { drawFrame(true); return; }
    if (act === "save-scene") { saveStory(btn.dataset.scene, "download"); return; }
    if (act === "share-ig") { saveStory(btn.dataset.scene, "share"); return; }
    if (act === "close-share") { state.shareSheet = ""; save(); render(); return; }
    if (act === "share-pick") { finishSharePick(btn.dataset.dest); return; }
    if (act === "replay") { stopNavRuntime(); state = defaultState(); save(); render(); return; }
    if (act === "finale-next") {
      state.shareSheet = "";
      state.finaleStep = Math.min(5, (state.finaleStep || 0) + 1);
      save(); render();
      return;
    }
  };

  const file = $("#shot");
  if (file) {
    file.onchange = () => {
      const f = file.files && file.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { state.photoDraft = r.result; save(); render(); };
      r.readAsDataURL(f);
    };
  }
}

window.__CHOO = {
  getState: () => state,
  reset() { stopNavRuntime(); state = defaultState(); save(); render(); },
  go,
  station,
  STATIONS,
  GOALS,
  DEMO_ORDER,
  pathTo: (a,b) => shortestPath(a,b),
  verifyGraph,
  setWalkRatio(t) {
    const total = pathLen(state.routePath);
    state.walkDist = Math.max(0, Math.min(total, total * t));
    state.arrived = (total - state.walkDist) <= ARRIVE;
    const pos = pointAlong(state.routePath, state.walkDist);
    state.userPos = { x: pos.x, y: pos.y };
    state.heading = pos.heading;
    state.walkSpeed = 0;
    paintNav();
  },
  pauseWalk() { state.walkPaused = true; },
  resumeWalk() { state.walkPaused = false; },
  arriveNow() {
    const total = pathLen(state.routePath);
    state.walkDist = total;
    state.arrived = true;
    state.walkSpeed = WALK_SPEED;
    const dest = station(state.nextId);
    if (dest) state.userPos = { x: dest.x, y: dest.y };
    paintNav();
  },
  setFinale(step) { state.screen = "finale"; state.finaleStep = step; save(); render(); },
  openMission,
  completeMission,
  makeStoryCanvas,
  saveStory,
};

render();

  </script>
