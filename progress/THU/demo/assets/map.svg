<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" fill="#0d0d0d"/>
  <!-- Paths / lakes -->
  <path d="M40 60 Q120 40 200 80 T360 70" stroke="#1f1f1f" stroke-width="28" stroke-linecap="round"/>
  <path d="M60 200 Q140 180 200 220 T340 210" stroke="#1f1f1f" stroke-width="22" stroke-linecap="round"/>
  <path d="M50 350 Q150 320 220 360 T360 340" stroke="#1f1f1f" stroke-width="24" stroke-linecap="round"/>
  <ellipse cx="200" cy="280" rx="70" ry="40" fill="#111" stroke="#2a2a2a" stroke-width="2"/>
  <text x="200" y="285" text-anchor="middle" fill="#3a3a3a" font-size="11" font-family="sans-serif">Hồ sen</text>
  <!-- Enclosure pads -->
  <rect x="55" y="100" width="70" height="55" rx="10" fill="#141414" stroke="#e11d2e" stroke-width="1.5" opacity="0.7"/>
  <rect x="240" y="70" width="70" height="55" rx="10" fill="#141414" stroke="#e11d2e" stroke-width="1.5" opacity="0.7"/>
  <rect x="160" y="200" width="70" height="55" rx="10" fill="#141414" stroke="#e11d2e" stroke-width="1.5" opacity="0.7"/>
  <rect x="80" y="300" width="70" height="55" rx="10" fill="#141414" stroke="#e11d2e" stroke-width="1.5" opacity="0.7"/>
  <rect x="250" y="270" width="70" height="55" rx="10" fill="#141414" stroke="#e11d2e" stroke-width="1.5" opacity="0.7"/>
  <!-- Gate -->
  <rect x="160" y="450" width="80" height="30" rx="6" fill="#1a1a1a" stroke="#e11d2e" stroke-width="1.5"/>
  <text x="200" y="470" text-anchor="middle" fill="#e11d2e" font-size="10" font-family="sans-serif">Cổng vào</text>
  <!-- Trees dots -->
  <circle cx="30" cy="150" r="6" fill="#1a1a1a"/><circle cx="370" cy="180" r="8" fill="#1a1a1a"/>
  <circle cx="40" cy="400" r="7" fill="#1a1a1a"/><circle cx="360" cy="420" r="6" fill="#1a1a1a"/>
  <text x="200" y="30" text-anchor="middle" fill="#e11d2e" font-size="14" font-family="sans-serif" letter-spacing="2">THẢO CẦM VIÊN</text>
</svg>
